<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პროდუქცია - Mell</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .price-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px 0;
        }
        .price-old {
            text-decoration: line-through;
            color: #aaa;
            font-size: 1rem;
        }
        .price-new {
            color: #e63946;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .sale-badge {
            background: #e63946;
            color: white;
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="container header-content">
        <div class="logo">
            <a href="index.html">
                <img src="images/logo.png" alt="Mell Logo">
            </a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">მთავარი</a></li>
                <li><a href="products.html">პროდუქცია</a></li>
                <li><a href="blog.html">ბლოგი</a></li>
                <li><a href="contact.html">კონტაქტი</a></li>
            </ul>
        </nav>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>
<section class="page-section">
    <div class="container">
        <h2>ჩვენი პროდუქცია</h2>
        <br><br>
        <div class="products-grid">
            <div class="product-card">
                <h3>თაფლი თხილით</h3>
                <span class="sale-badge">აქცია</span>
                <div class="price-wrapper">
                    <span class="price-old">25 ₾</span>
                    <span class="price-new">19 ₾</span>
                </div>
                <button onclick="orderProduct('თაფლი თხილით')" class="btn">შეკვეთა</button>
            </div>
            <div class="product-card">
                <h3>თაფლი ნიგვზით</h3>
                <span class="sale-badge">აქცია</span>
                <div class="price-wrapper">
                    <span class="price-old">27 ₾</span>
                    <span class="price-new">19 ₾</span>
                </div>
                <button onclick="orderProduct('თაფლი ნიგვზით')" class="btn">შეკვეთა</button>
            </div>
            <div class="product-card">
                <h3>თაფლი ნუშით</h3>
                <span class="sale-badge">აქცია</span>
                <div class="price-wrapper">
                    <span class="price-old">30 ₾</span>
                    <span class="price-new">19 ₾</span>
                </div>
                <button onclick="orderProduct('თაფლი ნუშით')" class="btn">შეკვეთა</button>
            </div>
        </div>
    </div>
</section>
<footer>
    <p>&copy; 2026 Mell</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
