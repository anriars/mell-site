<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პროდუქცია - Mell</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <div class="container header-content">
        <div class="logo">
            <a href="/"><img src="images/logo.png" alt="Mell Logo"></a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="/">მთავარი</a></li>
                <li><a href="products.html">პროდუქცია</a></li>
                <li><a href="blog.html">ბლოგი</a></li>
                <li><a href="contact.html">კონტაქტი</a></li>
            </ul>
        </nav>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>

<div class="menu-overlay" id="menuOverlay"></div>

<section class="page-section">
    <div class="container">
        <h2>ჩვენი პროდუქცია</h2>
        <br><br>
        <div class="products-grid">

            <div class="product-card">
                <img src="images/თხილი.jpg" alt="თაფლი თხილით" class="product-img">
                <h3>თაფლი თხილით</h3>
                <span class="sale-badge">აქცია</span>
                <div class="price-wrapper">
                    <span class="price-old">25 ₾</span>
                    <span class="price-new">19 ₾</span>
                </div>
                <button onclick="orderProduct('თაფლი თხილით')" class="btn">შეკვეთა</button>
            </div>

            <div class="product-card">
                <img src="images/ნიგოზი.jpg" alt="თაფლი ნიგვზით" class="product-img">
                <h3>თაფლი ნიგვზით</h3>
                <span class="sale-badge">აქცია</span>
                <div class="price-wrapper">
                    <span class="price-old">27 ₾</span>
                    <span class="price-new">19 ₾</span>
                </div>
                <button onclick="orderProduct('თაფლი ნიგვზით')" class="btn">შეკვეთა</button>
            </div>

            <div class="product-card">
                <img src="images/ნუში.jpg" alt="თაფლი ნუშით" class="product-img">
                <h3>თაფლი ნუშით</h3>
                <span class="sale-badge">აქცია</span>
                <div class="price-wrapper">
                    <span class="price-old">30 ₾</span>
                    <span class="price-new">19 ₾</span>
                </div>
                <button onclick="orderProduct('თაფლი ნუშით')" class="btn">შეკვეთა</button>
            </div>

        </div>
    </div>
</section>

<footer>
    <p>&copy; 2026 Mell</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
